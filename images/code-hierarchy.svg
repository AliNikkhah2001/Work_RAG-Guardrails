<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 300" width="1500" height="300" role="graphics-document" aria-roledescription="flowchart">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .root { fill:#dcfce7; stroke:#15803d; stroke-width:2.5; rx:8; ry:8; }
    .root text { font-family:sans-serif; font-size:15; fill:#14532d; text-anchor:middle; dominant-baseline:central; font-weight:700; }
    .box { fill:#eff6ff; stroke:#1d4ed8; stroke-width:2; rx:7; ry:7; }
    .box .t { font-family:sans-serif; font-size:13; fill:#0f172a; text-anchor:start; dominant-baseline:alphabetic; font-weight:600; }
    .box .f { font-family:sans-serif; font-size:11.5; fill:#334155; text-anchor:start; dominant-baseline:alphabetic; }
    .edge { stroke:#333; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
  </style>

  <!-- Root -->
  <g id="root">
    <rect x="700" y="12" width="120" height="42" class="root"/>
    <text x="760" y="35">guardrails/</text>
  </g>

  <!-- Children (x, files) -->
  <g id="c1"><rect x="20" y="110" width="220" height="130" class="box"/>
    <text x="35" y="132" class="t">root files</text>
    <text x="35" y="151" class="f">README.md · Dockerfile</text>
    <text x="35" y="166" class="f">pyproject.toml · .env.example</text>
    <text x="35" y="181" class="f">images/</text>
  </g>
  <g id="c2"><rect x="280" y="110" width="220" height="130" class="box"/>
    <text x="295" y="132" class="t">src/work_rag_guardrails/</text>
    <text x="295" y="151" class="f">api.py · service.py · judge.py</text>
    <text x="295" y="166" class="f">actions.py · signals.py · events.py</text>
    <text x="295" y="181" class="f">models.py · dashboard.py · observability.py</text>
    <text x="295" y="196" class="f">policies.py · risk/scorer.py · semantic/</text>
  </g>
  <g id="c3"><rect x="540" y="110" width="200" height="130" class="box"/>
    <text x="555" y="132" class="t">config/</text>
    <text x="555" y="151" class="f">config.yml · rails.co</text>
  </g>
  <g id="c4"><rect x="780" y="110" width="220" height="130" class="box"/>
    <text x="795" y="132" class="t">kb/</text>
    <text x="795" y="151" class="f">hurtlex_*.json / .tsv</text>
    <text x="795" y="166" class="f">persian_swear_*.json</text>
    <text x="795" y="181" class="f">prompt_injection_fa.json</text>
    <text x="795" y="196" class="f">out_of_scope.json</text>
  </g>
  <g id="c5"><rect x="1040" y="110" width="200" height="130" class="box"/>
    <text x="1055" y="132" class="t">policies/</text>
    <text x="1055" y="151" class="f">active.yaml · ics-credit-</text>
    <text x="1055" y="166" class="f">v1.0.0.yaml</text>
  </g>
  <g id="c6"><rect x="1280" y="110" width="200" height="130" class="box"/>
    <text x="1295" y="132" class="t">tests/</text>
    <text x="1295" y="151" class="f">test_input_rails.py</text>
    <text x="1295" y="166" class="f">test_hurtlex_allowlist.py</text>
  </g>

  <!-- Edges root -> children -->
  <line x1="760" y1="54" x2="130" y2="110" class="edge"/>
  <line x1="760" y1="54" x2="390" y2="110" class="edge"/>
  <line x1="760" y1="54" x2="640" y2="110" class="edge"/>
  <line x1="760" y1="54" x2="890" y2="110" class="edge"/>
  <line x1="760" y1="54" x2="1140" y2="110" class="edge"/>
  <line x1="760" y1="54" x2="1380" y2="110" class="edge"/>
</svg>
