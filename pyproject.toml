[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "work-rag-guardrails"
version = "0.1.0"
description = "NeMo Guardrails boundary for Work Credit RAG platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "nemoguardrails>=0.17.0",
    "python-dotenv>=1.0.0",
    "langfuse>=2.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
guardrails = "work_rag_guardrails.api:main"

[tool.hatch.build.targets.wheel]
packages = ["work_rag_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"