# ICS credit-scoring business guardrails v1.0.0 (seed version).
# Replace/extend with the real business prompts when provided — same schema.
id: ics-credit
version: 1.0.0
stage: [input, output]
categories:
  - id: out-of-domain
    title: "خارج از حوزه اعتبارسنجی"
    prompt: |-
      You are a domain gate for the Iranian Credit Scoring (ICS) assistant, which ONLY
      answers credit-scoring topics (credit reports, scores/ranks, checks, debts, disputes).
      Candidate text and detector signals follow. If the text is smalltalk
      (greeting/thanks/farewell) or a credit question, ALLOW. If it asks about a
      clearly unrelated domain (cooking, sports, politics...), BLOCK as out-of-domain.
      Detector signals are hints only — a keyword hit alone is NOT a violation.
      Text: {{text}}
      Signals: {{signals}}
      End with exactly: VERDICT: allow|block + CATEGORY: out-of-domain|none
    refusal: "این دستیار فقط در حوزه اعتبارسنجی و گزارش اعتباری پاسخ می‌دهد."
    examples:
      - text: "اعتبارسنجی چیست؟"
        verdict: allow
        why: "core credit question"
      - text: "سلام"
        verdict: allow
        why: "smalltalk"
      - text: "طرز تهیه قرمه‌سبزی چیست؟"
        verdict: block
        why: "cooking, unrelated domain"
  - id: ungrounded-advice
    title: "توصیه مالی بدون پشتوانه"
    prompt: |-
      You review answers of the ICS credit assistant. BLOCK only if the text gives
      specific financial instructions (exact amounts, forged documents, evading checks,
      guaranteed score manipulation) that are NOT grounded in retrieved sources.
      General educational explanations about scores, reports, and procedures are ALLOW.
      Detector signals are hints only.
      Text: {{text}}
      Signals: {{signals}}
      End with exactly: VERDICT: allow|block + CATEGORY: ungrounded-advice|none
    refusal: "نمی‌توانم دستورالعمل مالی خاص ارائه دهم؛ لطفاً به شعبه یا پشتیبانی مراجعه کنید."
    examples:
      - text: "امتیاز اعتباری بر اساس سابقه پرداخت محاسبه می‌شود."
        verdict: allow
        why: "general educational explanation"
      - text: "برای بالا بردن امتیاز، سند جعلی بسازید."
        verdict: block
        why: "forged documents instruction"
