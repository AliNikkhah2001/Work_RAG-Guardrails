<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="graphics-document" aria-roledescription="flowchart">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eaf7ec; stroke:#1d6b34; stroke-width:2; rx:7; ry:7; }
    .box text { font-family:sans-serif; font-size:14; fill:#0b3d1e; text-anchor:middle; dominant-baseline:central; font-weight:600; }
    .edge { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .edge.dashed { stroke-dasharray:6,4; marker-end:url(#dasharrow); }
    .label { font-family:sans-serif; font-size:12; fill:#444; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  </style>

  <!-- Nodes -->
  <g id="orch">
    <rect x="20" y="140" width="170" height="70" class="box"/>
    <text x="105" y="175">Orchestrator</text>
    <text x="105" y="198" style="font-size:12;font-weight:normal;">:8100</text>
  </g>
  <g id="gr">
    <rect x="270" y="115" width="180" height="100" class="box"/>
    <text x="360" y="150">Guardrails</text>
    <text x="360" y="173" style="font-size:12;font-weight:normal;">:8200</text>
  </g>
  <g id="judge">
    <rect x="255" y="260" width="210" height="80" class="box"/>
    <text x="360" y="295">Direct-LLM judge</text>
    <text x="360" y="318" style="font-size:12;font-weight:normal;">signals -&gt; policy -&gt; self-check</text>
  </g>
  <g id="ge">
    <rect x="520" y="140" width="160" height="70" class="box"/>
    <text x="600" y="175">Gemma</text>
    <text x="600" y="198" style="font-size:12;font-weight:normal;">:18000 Vast / :9000 H200</text>
  </g>

  <!-- Edges -->
  <line x1="190" y1="175" x2="270" y2="175" class="edge"/>
  <text x="230" y="158" class="label">1 input rail check</text>

  <line x1="450" y1="175" x2="520" y2="175" class="edge"/>
  <text x="485" y="158" class="label">2 chat/completions</text>

  <line x1="520" y1="205" x2="450" y2="205" class="edge"/>
  <text x="485" y="222" class="label">generated text</text>

  <line x1="360" y1="215" x2="360" y2="260" class="edge"/>
  <text x="378" y="235" class="label" style="text-anchor:start;">judge decides</text>

  <line x1="344" y1="260" x2="344" y2="215" class="edge dashed"/>
  <text x="326" y="235" class="label" style="text-anchor:end;">evidence + verdict</text>

  <polyline points="360,215 360,350 105,350 105,210" class="edge" marker-end="url(#arrow)"/>
  <text x="230" y="360" class="label">3 output rails + PII mask</text>
</svg>
