<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="graphics-document" aria-roledescription="flowchart">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eef6fb; stroke:#1f6fb2; stroke-width:2; rx:7; ry:7; }
    .box text { font-family:sans-serif; font-size:13; fill:#0c3a5c; text-anchor:middle; dominant-baseline:central; font-weight:600; }
    .box .sub { font-size:11; font-weight:normal; fill:#334155; }
    .edge { stroke:#333; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .label { font-family:sans-serif; font-size:12; fill:#444; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
    .subgraph { fill:#f1f5f9; stroke:#64748b; stroke-width:1; rx:8; ry:8; opacity:0.6; }
  </style>

  <!-- output rails subgraph background -->
  <rect x="190" y="500" width="540" height="185" class="subgraph"/>
  <text x="460" y="520" class="label" style="font-weight:700;fill:#475569;">output rails after generation</text>

  <!-- Main spine -->
  <g id="in"><rect x="105" y="15" width="150" height="55" class="box"/><text x="180" y="42">input text</text></g>
  <g id="norm"><rect x="105" y="85" width="150" height="55" class="box"/><text x="180" y="112">normalize_persian</text></g>
  <g id="sig"><rect x="70" y="155" width="220" height="60" class="box"/><text x="180" y="182">collect_signals</text><text x="180" y="200" class="sub">injection · jailbreak · hurtlex · profanity · scope · pii</text></g>
  <g id="judge"><rect x="70" y="235" width="220" height="60" class="box"/><text x="180" y="262">LLM judge</text><text x="180" y="280" class="sub">gemma policy · mizan · hybrid</text></g>
  <g id="self"><rect x="80" y="325" width="200" height="60" class="box"/><text x="180" y="352">direct-LLM self-check</text><text x="180" y="370" class="sub">Yes / No</text></g>
  <g id="fc"><rect x="5" y="240" width="100" height="50" class="box"/><text x="55" y="267">fail closed</text></g>

  <!-- Branches -->
  <g id="allow"><rect x="350" y="330" width="160" height="55" class="box"/><text x="430" y="357">allow</text><text x="430" y="375" class="sub">generation</text></g>
  <g id="ref"><rect x="475" y="395" width="170" height="55" class="box"/><text x="560" y="422">refuse</text><text x="560" y="440" class="sub">fail closed</text></g>
  <g id="gen"><rect x="350" y="425" width="160" height="50" class="box"/><text x="430" y="450">Gemma output</text></g>

  <!-- Output stage -->
  <g id="osig"><rect x="315" y="525" width="230" height="60" class="box"/><text x="430" y="552">output signals</text><text x="430" y="570" class="sub">PII-IR · secret · profanity · hurtlex</text></g>
  <g id="hb"><rect x="180" y="600" width="120" height="50" class="box"/><text x="240" y="627">hard block</text></g>
  <g id="mask"><rect x="345" y="600" width="170" height="55" class="box"/><text x="430" y="627">mask-and-continue</text><text x="430" y="645" class="sub">[masked-pii]</text></g>
  <g id="out"><rect x="575" y="600" width="130" height="50" class="box"/><text x="640" y="627">allow</text><text x="640" y="645" class="sub">user</text></g>

  <!-- Edges (spine) -->
  <line x1="180" y1="70" x2="180" y2="85" class="edge"/>
  <line x1="180" y1="150" x2="180" y2="155" class="edge"/>
  <line x1="180" y1="215" x2="180" y2="235" class="edge"/>
  <line x1="180" y1="295" x2="180" y2="325" class="edge"/>

  <!-- JUDGE -> FC (error/timeout) -->
  <line x1="70" y1="270" x2="105" y2="270" class="edge"/>
  <text x="85" y="255" class="label">error/timeout</text>

  <!-- SELF -> ALLOW (allow) -->
  <line x1="280" y1="360" x2="350" y2="360" class="edge"/>
  <text x="315" y="353" class="label">allow</text>

  <!-- SELF -> REF (block) -->
  <line x1="180" y1="390" x2="475" y2="395" class="edge"/>
  <text x="330" y="385" class="label">block</text>

  <!-- JUDGE -> REF (block) -->
  <line x1="260" y1="300" x2="475" y2="395" class="edge"/>
  <text x="365" y="345" class="label">block</text>

  <!-- ALLOW -> GEN -->
  <line x1="430" y1="385" x2="430" y2="425" class="edge"/>

  <!-- GEN -> OSIG -->
  <line x1="430" y1="475" x2="430" y2="525" class="edge"/>

  <!-- OSIG -> HB (secret) -->
  <line x1="315" y1="555" x2="300" y2="600" class="edge"/>
  <text x="265" y="590" class="label">secret</text>

  <!-- OSIG -> MASK (valid PII) -->
  <line x1="430" y1="585" x2="430" y2="600" class="edge"/>
  <text x="448" y="593" class="label" style="text-anchor:start;">valid PII</text>

  <!-- OSIG -> OUT (clean) -->
  <line x1="545" y1="555" x2="575" y2="600" class="edge"/>
  <text x="570" y="590" class="label">clean</text>
</svg>
